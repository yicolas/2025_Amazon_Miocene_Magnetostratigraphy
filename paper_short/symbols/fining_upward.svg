<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 20 20" width="80" height="80" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Fining-upward interval (wide base = coarse, apex = fine)</title>
  <path id="fill" fill="#d8c08a" stroke="#000" stroke-width="0.9" stroke-linejoin="miter"
        d="M -4.5 9.5 L 4.5 9.5 L 0 -9.5 Z"/>
  <!-- grain stipple, denser/larger toward the base -->
  <path id="detail" fill="none" stroke="#000" stroke-width="0.9" stroke-linecap="round"
        d="M -2.6 7.6 L -2.5 7.6 M 0 7.2 L 0.1 7.2 M 2.5 7.6 L 2.6 7.6 M -1.3 4.6 L -1.2 4.6 M 1.3 4.8 L 1.4 4.8 M 0 1.6 L 0.1 1.6"/>
</svg>
